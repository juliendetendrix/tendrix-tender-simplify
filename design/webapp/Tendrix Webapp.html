<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tendrix — Webapp (redesign)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    /* Marque Tendrix */
    --navy: #0c1c98;
    --navy-600: #1a2bb0;
    --navy-700: #0a1680;
    --navy-900: #070f55;
    --yellow: #f9bd43;
    --yellow-soft: #fef3d6;

    /* Neutres cool raffinés */
    --bg: #f4f5fa;
    --surface: #ffffff;
    --surface-2: #fafbff;
    --ink: #141a33;
    --ink-2: #3d4566;
    --muted: #6b7390;
    --muted-2: #9aa1bd;
    --line: #e7e9f3;
    --line-2: #eef0f8;

    /* Verdicts */
    --go-bg: #e8f6ee; --go-fg: #12824c; --go-dot: #1ca65f;
    --warn-bg: #fdf2dd; --warn-fg: #ad6a14; --warn-dot: #e0972a;
    --no-bg: #fcebeb; --no-fg: #c43838; --no-dot: #db4a4a;

    /* Échelle / densité (tweakable) */
    --radius: 14px;
    --radius-sm: 10px;
    --pad: 20px;
    --gap: 18px;
    --shadow-sm: 0 1px 2px rgba(20,26,51,.04), 0 1px 3px rgba(20,26,51,.05);
    --shadow-md: 0 4px 14px -4px rgba(20,26,51,.10), 0 2px 6px -2px rgba(20,26,51,.06);
    --shadow-lg: 0 18px 40px -12px rgba(12,28,152,.22);
    --accent: var(--yellow); /* tweakable accent */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { min-height: 100vh; }
  .mono { font-family: "Spline Sans Mono", monospace; font-feature-settings: "tnum"; }
  .tnum { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ::selection { background: color-mix(in oklab, var(--navy) 18%, white); }

  /* lucide icon sizing */
  [data-lucide] { width: 1em; height: 1em; stroke-width: 2; vertical-align: middle; }
  .ico-sm [data-lucide] { width: 15px; height: 15px; }
  .ico-md [data-lucide] { width: 18px; height: 18px; }

  /* ── App shell ── */
  .app { display: flex; min-height: 100vh; }

  /* Sidebar */
  .side {
    width: 248px; flex-shrink: 0; position: fixed; inset: 0 auto 0 0;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-900) 100%);
    display: flex; flex-direction: column; z-index: 40;
  }
  .side-logo { padding: 22px 22px 18px; }
  .side-logo img { height: 26px; filter: var(--logo-filter, brightness(0) invert(1)); transition: filter .25s; }
  .side-cta {
    margin: 4px 14px 14px; height: 42px; border-radius: 11px;
    background: var(--accent); color: var(--navy); font-weight: 800; font-size: 13.5px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 6px 16px -6px rgba(249,189,67,.6); transition: transform .15s, box-shadow .15s;
  }
  .side-cta:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -6px rgba(249,189,67,.7); }
  .side-nav { flex: 1; padding: 6px 12px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
  .side-sec { color: rgba(255,255,255,.4); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 14px 12px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px;
    color: rgba(255,255,255,.62); font-size: 14px; font-weight: 600; text-align: left; width: 100%;
    transition: background .15s, color .15s; position: relative;
  }
  .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,.13); color: #fff; }
  .nav-item.active::before { content: ""; position: absolute; left: -12px; top: 50%; transform: translateY(-50%); width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav-item .badge { margin-left: auto; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.16); color: #fff; padding: 1px 7px; border-radius: 20px; }
  .nav-item.active .badge { background: var(--accent); color: var(--navy); }

  .side-foot { padding: 12px; border-top: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 10px; }
  .credit-pill { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,.09); border-radius: 11px; padding: 10px 12px; transition: background .15s; }
  .credit-pill:hover { background: rgba(255,255,255,.14); }
  .credit-pill .c-left { display: flex; align-items: center; gap: 8px; color: #fff; }
  .credit-pill .c-num { font-weight: 800; font-size: 15px; }
  .side-user { display: flex; align-items: center; gap: 10px; padding: 2px; }
  .side-user .av { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.16); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex-shrink: 0; }
  .side-user .nm { color: #fff; font-size: 12.5px; font-weight: 700; line-height: 1.2; }
  .side-user .em { color: rgba(255,255,255,.5); font-size: 11px; }

  /* Main */
  .main { flex: 1; min-width: 0; margin-left: 248px; }
  .topbar {
    height: 64px; background: rgba(255,255,255,.8); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 16px; padding: 0 32px;
  }
  .topbar h1 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .topbar .crumb { color: var(--muted); font-weight: 600; font-size: 13.5px; }
  .search {
    margin-left: auto; display: flex; align-items: center; gap: 9px; width: 300px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 9px 13px;
    color: var(--muted); transition: border-color .15s, box-shadow .15s;
  }
  .search:focus-within { border-color: color-mix(in oklab, var(--navy) 40%, white); box-shadow: 0 0 0 3px color-mix(in oklab, var(--navy) 12%, white); }
  .search input { border: none; outline: none; background: none; font-size: 13.5px; color: var(--ink); width: 100%; font-family: inherit; }
  .icon-btn { width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface); transition: background .15s, color .15s; position: relative; }
  .icon-btn:hover { background: var(--surface-2); color: var(--navy); }
  .icon-btn .dot { position: absolute; top: 9px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--no-dot); border: 2px solid var(--surface); }

  .page { padding: 28px 32px 64px; max-width: 1320px; margin: 0 auto; }
  .page-anim { animation: pageIn .34s cubic-bezier(.22,.61,.36,1); }
  @keyframes pageIn { from { transform: translateY(9px); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .page-anim { animation: none; } }

  /* Cards générique */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .card-pad { padding: var(--pad); }
  .card-h { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
  .card-h .t { font-size: 13.5px; font-weight: 800; letter-spacing: .005em; }
  .card-h .ico { color: var(--navy); display: flex; }
  .card-h .more { margin-left: auto; color: var(--muted); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 3px; }
  .card-h .more:hover { color: var(--navy); }

  /* Chips / badges */
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 7px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .v-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 7px; letter-spacing: .02em; }
  .v-go { background: var(--go-bg); color: var(--go-fg); }
  .v-warn { background: var(--warn-bg); color: var(--warn-fg); }
  .v-no { background: var(--no-bg); color: var(--no-fg); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 11px; font-weight: 700; font-size: 13.5px; transition: transform .14s, box-shadow .14s, background .14s; }
  .btn-primary { background: var(--navy); color: #fff; box-shadow: var(--shadow-md); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
  .btn-accent { background: var(--accent); color: var(--navy); }
  .btn-accent:hover { transform: translateY(-1px); }
  .btn-ghost { border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--navy); border-color: color-mix(in oklab, var(--navy) 25%, white); }
  .btn-sm { height: 34px; padding: 0 13px; font-size: 12.5px; border-radius: 9px; }

  .grid { display: grid; gap: var(--gap); }
  .scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  .scrollbar::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }

  .ring-track { stroke: var(--line); }
  .clip1 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .clip2 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* density compact tweak */
  body.compact { --pad: 15px; --gap: 13px; --radius: 12px; }

  @media (max-width: 1100px) { .side { width: 76px; } .side .lbl, .side-sec, .side-user .nm, .side-user .em, .credit-pill .c-txt { display: none; } .main { margin-left: 76px; } .side-logo img { height: 22px; } }

  /* ── Variantes de barre latérale (Tweaks) ── */
  .side, .nav-item, .side-cta, .credit-pill, .side-user .av { transition: background .25s, color .2s, border-color .25s, box-shadow .25s; }

  /* Clair — sidebar blanche, navy en accent */
  body[data-sidebar="clair"] .side { background: var(--surface); border-right: 1px solid var(--line); }
  body[data-sidebar="clair"] .side-sec { color: var(--muted-2); }
  body[data-sidebar="clair"] .nav-item { color: var(--ink-2); }
  body[data-sidebar="clair"] .nav-item:hover { background: var(--surface-2); color: var(--navy); }
  body[data-sidebar="clair"] .nav-item.active { background: color-mix(in oklab, var(--navy) 8%, white); color: var(--navy); }
  body[data-sidebar="clair"] .nav-item .badge { background: var(--line); color: var(--ink-2); }
  body[data-sidebar="clair"] .nav-item.active .badge { background: var(--navy); color: #fff; }
  body[data-sidebar="clair"] .side-foot { border-top-color: var(--line); }
  body[data-sidebar="clair"] .credit-pill { background: var(--surface-2); border: 1px solid var(--line); }
  body[data-sidebar="clair"] .credit-pill .c-left, body[data-sidebar="contour"] .credit-pill .c-left { color: var(--ink); }
  body[data-sidebar="clair"] .credit-pill .c-num, body[data-sidebar="contour"] .credit-pill .c-num { color: var(--navy); }
  body[data-sidebar="clair"] .credit-pill .c-txt, body[data-sidebar="contour"] .credit-pill .c-txt { color: var(--muted) !important; }
  body[data-sidebar="clair"] .side-user .av, body[data-sidebar="contour"] .side-user .av { background: color-mix(in oklab, var(--navy) 10%, white); color: var(--navy); }
  body[data-sidebar="clair"] .side-user .nm, body[data-sidebar="contour"] .side-user .nm { color: var(--ink); }
  body[data-sidebar="clair"] .side-user .em, body[data-sidebar="contour"] .side-user .em { color: var(--muted); }

  /* Minimal — fond clair, item actif en pastille navy pleine */
  body[data-sidebar="contour"] .side { background: var(--surface-2); border-right: 1px solid var(--line); }
  body[data-sidebar="contour"] .side-sec { color: var(--muted-2); }
  body[data-sidebar="contour"] .nav-item { color: var(--muted); }
  body[data-sidebar="contour"] .nav-item:hover { background: #fff; color: var(--navy); }
  body[data-sidebar="contour"] .nav-item.active { background: var(--navy); color: #fff; box-shadow: var(--shadow-md); }
  body[data-sidebar="contour"] .nav-item.active::before { display: none; }
  body[data-sidebar="contour"] .nav-item .badge { background: var(--line); color: var(--ink-2); }
  body[data-sidebar="contour"] .nav-item.active .badge { background: var(--yellow); color: var(--navy); }
  body[data-sidebar="contour"] .side-cta { background: var(--navy); color: #fff; box-shadow: 0 6px 16px -6px rgba(12,28,152,.5); }
  body[data-sidebar="contour"] .side-foot { border-top-color: var(--line); }
  body[data-sidebar="contour"] .credit-pill { background: #fff; border: 1px solid var(--line); }

</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
